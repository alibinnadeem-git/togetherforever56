name: Together Forever CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-only placeholders. CI validates compilation/type safety without
      # connecting to production Neon or requiring repository secrets.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/togetherforever_ci
      NEON_AUTH_BASE_URL: https://ci-auth.invalid
      NEON_AUTH_COOKIE_SECRET: ci-only-cookie-secret-00000000000000000000000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      BASE_URL: https://togetherforever56.vercel.app
    steps:
      - name: Public landing identity
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --location "$BASE_URL/")"
          grep -Fq 'Together Forever' <<<"$body"
          grep -Fq 'Brotherhood • Est. 1977' <<<"$body"
          grep -Fq 'Registered Members' <<<"$body"
          grep -Fq '16 + 3 Officers' <<<"$body"
          grep -Fq '© 2025 Together Forever. All rights reserved.' <<<"$body"

      - name: Auth and reset routes
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$BASE_URL/auth/sign-in")" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$BASE_URL/auth/reset-password")" = "200"

      - name: Health endpoint
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error "$BASE_URL/api/health")"
          grep -Fq '"ok":true' <<<"$body"
          grep -Fq '"database":"connected"' <<<"$body"

      - name: Protected APIs deny anonymous access
        shell: bash
        run: |
          set -euo pipefail
          for path in /api/admin/readiness /api/admin/communications /api/admin/finance /api/admin/roles; do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' "$BASE_URL$path")"
            if [[ "$code" != "401" && "$code" != "403" ]]; then
              echo "$path returned $code; expected 401 or 403"
              exit 1
            fi
          done
