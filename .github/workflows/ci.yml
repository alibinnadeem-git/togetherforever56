name: Together Forever CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-only placeholders. CI validates compilation/type safety without
      # connecting to production Neon or requiring repository secrets.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/togetherforever_ci
      NEON_AUTH_BASE_URL: https://ci-auth.invalid
      NEON_AUTH_COOKIE_SECRET: ci-only-cookie-secret-00000000000000000000000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
